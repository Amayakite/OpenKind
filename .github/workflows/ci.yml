name: CI
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check core logic
        run: swift run OpenKindChecks
      - name: Build application
        run: ./scripts/build-app.sh
      - name: Verify app bundle
        run: codesign --verify --deep --strict build/OpenKind.app
